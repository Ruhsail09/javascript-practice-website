<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="js/register.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Create Account</h1>
    <p>Register to start shopping</p>
    <form id="Register-form">

        <div id="">
            <label for="email"></label>
            Email
            <input type="email" id="register-email" placeholder="Enter your Email">
        </div>
        <div id="">
            <label for="name"></label>
            Name
            <input type="text" id="register-name" placeholder="Enter your naem">
        </div>
        <div>
            <label for="registerpassword"></label>Password
            <input type="password" id="register-password" placeholder="Enter your password">
        </div>
        <div>
            <label for="confirm-password"></label>
            Repeat Password
            <input type="password" id="confirm-password" placeholder="Repeat password">
        </div>

        <p id="register-message"></p>
        <button type="submit">Submit</button>
    </form>
    <p>Already have an account?</p>
    <a href="index.html"></a>
</body>
</html>
